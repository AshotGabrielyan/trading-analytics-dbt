# Local Metabase with the DuckDB driver, reading the dbt warehouse.
# The official Metabase image is Alpine-based and can't load DuckDB, so the image
# is built from ./Dockerfile (Metabase + MotherDuck's DuckDB driver, versions pinned there).
#
#   docker compose -f metabase/docker-compose.yml up -d --build    # start → http://localhost:3000
#   docker compose -f metabase/docker-compose.yml down     # stop
#
# The warehouse is attached read-only in the Metabase connection settings.
# DuckDB's file lock does not reach across Docker's file sharing, so `dbt build` on the
# host is not blocked — but Metabase keeps reading its stale copy. After every build:
#   docker compose -f metabase/docker-compose.yml restart
# Only the marts schema is queryable here: staging/intermediate are views over
# data/*.csv, which is not mounted into the container.

services:
  metabase:
    build: .
    image: trading-metabase-duckdb:0.63.17-duckdb1.5.5.0
    container_name: trading_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../warehouse:/warehouse
      - ./data:/metabase-data   # Metabase app database (questions, dashboards) — git-ignored
